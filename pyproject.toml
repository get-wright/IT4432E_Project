[project]
name = "face-recognition-siamese"
version = "0.1.0"
description = "Face recognition with Siamese network — CASIA/CelebA training, LFW eval, FastAPI app."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "facenet-pytorch>=2.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "kaggle>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.3"]

[tool.pytest.ini_options]
testpaths = ["training_pipeline/tests", "application/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["training_pipeline*", "application*"]

[tool.ruff]
line-length = 100
